<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie - Shekinah Royale Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #050B1C;
  --bg2: #08182F;
  --gold: #D4AF37;
  --text: #F5F5F5;
  --muted: rgba(245,245,245,0.72);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  min-height: 100%;
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  overflow-x: hidden;
  background: radial-gradient(circle at top, rgba(212,175,55,0.12), transparent 25%),
              linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
}
body {
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  width: 100%;
  backdrop-filter: blur(16px);
  background: rgba(3,9,24,0.92);
  border-bottom: 1px solid rgba(212,175,55,0.18);
  z-index: 10;
}
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: grid;
  place-items: center;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 700;
}
.logo-text h1 {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--text);
}
.logo-text p {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
nav {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
nav a {
  color: var(--gold);
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.32);
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  transition: color .25s ease, transform .25s ease, background .25s ease, border-color .25s ease;
}
nav a:hover,
nav a.active {
  color: var(--gold);
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.55);
  transform: translateY(-1px);
}
nav a.active {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.35);
}
.gallery-hero {
  max-width: 1240px;
  margin: 0 auto;
  padding: 100px 32px 40px;
  text-align: center;
}
.gallery-top {
  display: inline-grid;
  gap: 18px;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  align-items: center;
}
.gallery-top h1 {
  margin: 0;
  font-family: 'Cinzel', serif;
  font-size: clamp(5rem, 6vw, 8rem);
  color: var(--gold);
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.gallery-top .gallery-subtitle {
  margin: 0;
  color: #ffffff;
  font-family: 'Cinzel', serif;
  font-size: clamp(1.2rem, 1.7vw, 2rem);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.gallery-top p {
  margin: 0;
  color: rgba(245,245,245,0.88);
  font-size: 1rem;
  line-height: 1.8;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
}
.gallery-grid {
  max-width: 1240px;
  margin: 40px auto 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(240px, 1fr));
  gap: 20px;
}
.gallery-card {
  min-height: 280px;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  box-shadow: 0 18px 40px rgba(0,0,0,0.25);
}
.gallery-card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  transition: transform .35s ease;
}
.gallery-card:hover img {
  transform: scale(1.03);
}
.gallery-action {
  display: flex;
  justify-content: center;
  margin: 40px 0 80px;
}
.btn-gallery {
  padding: 18px 44px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(212,175,55,1), rgba(255,214,105,0.95));
  color: #071026;
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  box-shadow: 0 18px 40px rgba(212,175,55,0.22);
  transition: transform .25s ease, filter .25s ease;
}
.btn-gallery:hover {
  transform: translateY(-2px);
  filter: brightness(1.02);
}
footer {
  padding: 26px 32px 40px;
  text-align: center;
  color: rgba(245,245,245,0.68);
  font-size: .95rem;
}
@media (max-width: 1120px) {
  .gallery-grid {
    grid-template-columns: repeat(2, minmax(220px, 1fr));
  }
}
@media (max-width: 820px) {
  .container {
    flex-direction: column;
    align-items: flex-start;
  }
  .gallery-top {
    padding: 24px;
  }
  .gallery-grid {
    grid-template-columns: 1fr;
  }
  .gallery-card img {
    height: 220px;
  }
  .gallery-location {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
